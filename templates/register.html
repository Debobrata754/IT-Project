<!DOCTYPE html>
<html>

<head>
  <title>Student Registration</title>
</head>
<link rel="stylesheet" href="static/style.css">

<body>
  <div id="head_part">
    <h1>Student Registration Form</h1>
  </div>
  <div id="main">
    <form action="/register" method="POST">
      <div id="st">
        <!-- student information -->
        <div id="student">
          <h3>Student Information:</U></h3>

          <label id="name">Name:</label>
          <input type="text" name="first_name" placeholder="First Name" required>
          <input type="text" name="middle_name" placeholder="Middle Name">
          <input type="text" name="last_name" placeholder="Last Name" required>
          <br><br>
          <label id="contact">Contact Number:</label>
          <input type="text" name="contact" placeholder="Enter Contact Number" required>
          <label id="dob">Date of Birth:</label>
          <input type="date" name="date_of_birth" required>
          <br><br>
          <label id="gender">Gender:</label>
          <label>
            <input type="radio" name="gender" value="male">Male</label>
          <label>
            <input type="radio" name="gender" value="female">Female</label>
          <label>
            <input type="radio" name="gender" value="other">Others</label>

          <label id="adhaarS">Aadhaar No.:</label>
          <input type="text" name="aadhaar_number" placeholder="Enter Aadhaar Number" required>
          <br><br>
          <label id="email-label">Email:</label>
          <input type="email" name="email" id="email" placeholder="Enter Email Address" required>
          <label id="bloodGr">Blood Group:</label>
          <select id="blood_group" name="blood group" required>
            <option value="">Select Blood Group</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
          </select>
          <br><br>
          <label id="disabilities">Any Disabilities:</label>
          <input type="radio" name="disability" value="yes">Yes
          <input type="radio" name="disability" value="no">No
          <label for="year" id="year-label">Year:</label>
          <select id="year" name="year" required>
            <option value="">Select Year</option>
            <option value="1st Year">1st Year</option>
            <option value="2nd Year">2nd Year</option>
            <option value="3rd Year">3rd Year</option>
            <option value="4th Year">4th Year</option>
          </select>
          <br><br>

        </div>
        <div id="photo-upload">

          <label class="photo-label">
            Upload Photo <span>*</span>
          </label>

          <!-- Photo preview box -->
          <label for="photo" class="photo-box">
            <span id="photoText">No file selected</span>
            <img id="photoPreview" alt="">
          </label>

          <!-- File name -->
          <p id="fileName">No file chosen</p>

          <!-- Choose button -->
          <label for="photo" class="choose-button" id="choose-button">
            Choose File
          </label>

          <input type="file" id="photo" name="photo" accept="image/jpeg, image/png" required>

          <p class="upload-info">
            JPG or PNG only • Maximum size: 200 KB
          </p>

        </div>
        <div id="signature-upload">

          <label class="signature-label">
            Upload Signature <span>*</span>
          </label>

          <!-- Signature preview box -->
          <label for="signature" class="signature-box">
            <span id="signatureText">No file selected</span>
            <img id="signaturePreview" alt="">
          </label>

          <!-- File name -->
          <p id="signatureFileName">No file chosen</p>

          <!-- Choose button -->
          <label for="signature" class="signature-button"id="choose-button">
            Choose File
          </label>

          <input type="file" id="signature" name="signature" accept="image/jpeg, image/png" required>

          <p class="signature-info">
            JPG or PNG only • Maximum size: 200 KB
          </p>

        </div>
      </div>
      <!-- parent information -->
      <div id="parent" class="common">
        <h3>Parents Information:</h3>
        <h4>Father's Details:</h4>

        <label id="name">Name:</label>
        <input type="text" name="first_name" placeholder="First Name" required>
        <input type="text" name="middle_name" placeholder="Middle Name">
        <input type="text" name="last_name" placeholder="Last Name" required>
        <label id="occupation">Occupation:</label>
        <input type="text" name="occupation" placeholder="Enter Father's Occupation" required>

        <label id="contactP">Contact Number:</label>
        <input type="text" name="contact" placeholder="Enter Contact Number" required>

        <label id="adhaar">Aadhaar No.:</label>
        <input type="text" name="aadhaar_number" placeholder="Enter Aadhaar Number" required>
        <br>
        <h4>Mother's Details:</h4>

        <label id="name">Name:</label>
        <input type="text" name="first_name" placeholder="First Name" required>
        <input type="text" name="middle_name" placeholder="Middle Name">
        <input type="text" name="last_name" placeholder="Last Name" required>

        <label id="occupation">Occupation:</label>
        <input type="text" name="occupation" placeholder="Enter Mother's Occupation" required>

        <label id="contactP">Contact Number:</label>
        <input type="text" name="contact" placeholder="Enter Contact Number" required>

        <label id="adhaar">Aadhaar No.:</label>
        <input type="text" name="aadhaar_number" placeholder="Enter Aadhaar Number" required>

        <br><br>

      </div>

      <!-- Address information -->
      <div id="address" class="common">
        <h3>Address Information:</h3>

        <label id="state-label">State:</label>
        <select id="state" name="state" required>
          <option value="">Select state</option>
          <option value="Andhra Pradesh">Andhra Pradesh</option>
          <option value="Arunachal Pradesh">Arunachal Pradesh</option>
          <option value="Assam">Assam</option>
          <option value="Bihar">Bihar</option>
          <option value="Chhattisgarh">Chhattisgarh</option>
          <option value="Goa">Goa</option>
          <option value="Gujarat">Gujarat</option>
          <option value="Haryana">Haryana</option>
          <option value="Himachal Pradesh">Himachal Pradesh</option>
          <option value="Jharkhand">Jharkhand</option>
          <option value="Karnataka">Karnataka</option>
          <option value="Kerala">Kerala</option>
          <option value="Madhya Pradesh">Madhya Pradesh</option>
          <option value="Maharashtra">Maharashtra</option>
          <option value="Manipur">Manipur</option>
          <option value="Meghalaya">Meghalaya</option>
          <option value="Mizoram">Mizoram</option>
          <option value="Nagaland">Nagaland</option>
          <option value="Odisha">Odisha</option>
          <option value="Punjab">Punjab</option>
          <option value="Rajasthan">Rajasthan</option>
          <option value="Sikkim">Sikkim</option>
          <option value="Tamil Nadu">Tamil Nadu</option>
          <option value="Telangana">Telangana</option>
          <option value="Tripura">Tripura</option>
          <option value="Uttar Pradesh">Uttar Pradesh</option>
          <option value="Uttarakhand">Uttarakhand</option>
          <option value="West Bengal">West Bengal</option>
        </select>

        <label id="city-label">City:</label>
        <input type="text" name="city" placeholder="City" required>

        <label id="street-label">Street Name:</label>
        <input type="text" name="street_name" placeholder="Street Name" required>

        <label id="pin-label">Pin Code:</label>
        <input type="text" name="pin_code" placeholder="Pin Code" required>
        <br><br>
        <label id="address-label">Home Address:</label>
        <input type="text" name="address" placeholder="Enter Home Address" required>
        <br><br>


      </div>
      <!-- Academic Information -->
      <div id="academic" class="common">

        <h3>Academic Information:</h3>

        <label>Name of 10th Board:</label>
        <input type="text" name="class10_board" placeholder="Enter board name">

        <label id="class10-marks-label">10th Marks in percentage:</label>
        <input type="number" name="class10_marks" placeholder="Enter marks">
        <br><br>
        <label id="class10-marksheet-label">Upload a copy of 10th Marksheet:</label>
        <input type="file" name="class10_marksheet" accept="image/*">

        <br><br>

        <label>Name of 12th Board:</label>
        <input type="text" name="class12_board" placeholder="Enter board name">

        <label id="class12-marks-label">12th Marks in percentage:</label>
        <input type="number" name="class12_marks" placeholder="Enter marks">
        <br><br>
        <label id="class12-marksheet-label">Upload a copy of 12th Marksheet:</label>
        <input type="file" name="class12_marksheet" accept="image/*">

        <br><br>

        <label id="college-label">College Name:</label>
        <input type="text" name="college" placeholder="Enter college name">

        <label id="course-label">Course:</label>
        <input type="text" name="course" placeholder="Enter course">
        <label for="year" id="year-label">Year:</label>
          <select id="year" name="year" required>
            <option value="">Select Year</option>
            <option value="1st Year">1st Year</option>
            <option value="2nd Year">2nd Year</option>
            <option value="3rd Year">3rd Year</option>
            <option value="4th Year">4th Year</option>
          </select>
          
        <label id="semester-label">Semester:</label>
        <select id="semester" name="semester" required>
          <option value="">Select Semester</option>
          <option value="1st">1st</option>
          <option value="2nd">2nd</option>
          <option value="3rd">3rd</option>
          <option value="4th">4th</option>
          <option value="5th">5th</option>
          <option value="6th">6th</option>
          <option value="7th">7th</option>
          <option value="8th">8th</option>
        </select>
        <br><br>
      </div>


  </div>

  </div>

  </div>

  <div class="acknowledgement">
    <input type="checkbox" id="acknowledge" name="acknowledge" required>
    <label for="acknowledge">
      I hereby declare that the above information provided by me is true and correct
      to the best of my knowledge.
    </label>
  </div>
  <br><br>
  <div id="registerBtn"><button type="submit" id="choose-button">Register</button></div>

  </form>
<br><br>
  </div>
  <script>
    const photoInput = document.getElementById("photo");
    const photoPreview = document.getElementById("photoPreview");
    const photoText = document.getElementById("photoText");
    const fileName = document.getElementById("fileName");

    photoInput.addEventListener("change", function () {

      const file = this.files[0];

      if (file) {
        photoPreview.src = URL.createObjectURL(file);
        photoPreview.style.display = "block";
        photoText.style.display = "none";

        fileName.textContent = file.name;
      }
    });
    const signatureInput = document.getElementById("signature");
    const signaturePreview = document.getElementById("signaturePreview");
    const signatureText = document.getElementById("signatureText");
    const signatureFileName = document.getElementById("signatureFileName");

    signatureInput.addEventListener("change", function () {

      const sig_file = this.files[0];

      if (sig_file) {
        signaturePreview.src = URL.createObjectURL(sig_file);
        signaturePreview.style.display = "block";
        signatureText.style.display = "none";

        signatureFileName.textContent = sig_file.name;
      }
    });
  </script>

</body>

</html>
