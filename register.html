<!DOCTYPE html>
<html>

<head>
  <title>Student Registration</title>
</head>
<link rel="stylesheet" href="style.css">

<body>
  <div id="head_part">
    <h1>Student Registration</h1>
  </div>
  <div id="main">
    <form action="/register" method="POST">

      <!-- student information -->
      <div id="student" class="common">
        <h3>Student Information:</U></h3>

        <label id="name">Name:</label>
        <input type="text" name="first_name" placeholder="First Name" required>
        <input type="text" name="middle_name" placeholder="Middle Name">
        <input type="text" name="last_name" placeholder="Last Name" required>

        <label id="contact">Contact Number:</label>
        <input type="text" name="contact" placeholder="Enter Contact Number" required>
        <br><br>
        <label>Upload Passport size photo</label>
      <input type="file" name="upload_image" accept="image/*">
        <br><br>

        <label id="dob">Date of Birth:</label>
        <input type="date" name="date_of_birth" required>
        <label for="year" id="year-label">Year:</label>
        <select id="year" name="year" required>
          <option value="">Select Year</option>
          <option value="1st Year">1st Year</option>
          <option value="2nd Year">2nd Year</option>
          <option value="3rd Year">3rd Year</option>
          <option value="4th Year">4th Year</option>
        </select>

        <label id="gender">Gender:</label>
        <label>
          <input type="radio" name="gender" value="male">Male</label>
        <label>
          <input type="radio" name="gender" value="female">Female</label>
        <label>
          <input type="radio" name="gender" value="other">Others</label>
        <br><br>

        <label>Aadhaar Number</label>
        <input type="text" name="aadhaar_number" placeholder="Enter Aadhaar Number" required>
             
        <label id="email-label">Email:</label>
        <input type="email" name="email" id="email" placeholder="Enter Email Address" required>

        <label>Blood Group:</label>
        <select id="blood group" name="blood group" required>
          <option value="">Select Blood Group</option>
          <option value="A+">A+</option>
          <option value="B+">B+</option>
          <option value="AB+">AB+</option>
          <option value="O+">O+</option>
          <option value="A-">A-</option>
          <option value="B-">B-</option>
          <option value="AB-">AB-</option>
          <option value="O-">O-</option>
        </select>

        <label id="disabilities">Any Disabilities:</label>
        <input type="radio" name="disability" value="yes">Yes
        <input type="radio" name="disability" value="no">No
        <br><br>

      </div>

      <!-- parent information -->
      <div id="parent" class="common">
        <h3>Parents Information:</h3>
        <h4>Father's Details:</h4>

        <label id="name">Name:</label>
        <input type="text" name="first_name" placeholder="First Name" required>
        <input type="text" name="middle_name" placeholder="Middle Name">
        <input type="text" name="last_name" placeholder="Last Name" required>
        <br><br>

        <label>Occupation:</label>
        <input type="text" name="occupation" placeholder="Enter Father's Occupation" required>
        
        <label id="contact">Contact Number:</label>
        <input type="text" name="contact" placeholder="Enter Contact Number" required>

        <label>Aadhaar Number</label>
        <input type="text" name="aadhaar_number" placeholder="Enter Aadhaar Number" required>
        <br><br>


        <h4>Mother's Details:</h4>

        <label id="name">Name:</label>
        <input type="text" name="first_name" placeholder="First Name" required>
        <input type="text" name="middle_name" placeholder="Middle Name">
        <input type="text" name="last_name" placeholder="Last Name" required>
        <br><br>
        
        <label>Occupation:</label>
        <input type="text" name="occupation" placeholder="Enter Mother's Occupation" required>

        <label id="contact">Contact Number:</label>
        <input type="text" name="contact" placeholder="Enter Contact Number" required>

        <label>Aadhaar Number</label>
        <input type="text" name="aadhaar_number" placeholder="Enter Aadhaar Number" required>
      
        <br><br>

      </div>
      
      <!-- Academic Information -->
      <div id="academic" class="common">

      <h3>Academic Information:</h3>

      <label>Name of 10th Board:</label>
      <input type="text" name="class10_board" placeholder="Enter board name">

      <label>10th Marks in percentage:</label>
      <input type="number" name="class10_marks" placeholder="Enter marks">

      <label>Upload a copy of 10th Marksheet:</label>
      <input type="file" name="class10_marksheet" accept="image/*">

      <br><br>

      <label>Name of 12th Board:</label>
      <input type="text" name="class12_board" placeholder="Enter board name">

      <label>12th Marks in percentage:</label>
      <input type="number" name="class12_marks" placeholder="Enter marks">

      <label>Upload a copy of 12th Marksheet:</label>
      <input type="file" name="class12_marksheet" accept="image/*">

      <br><br>

      <label>College Name:</label>
      <input type="text" name="college" placeholder="Enter college name">

      <label>Course:</label>
      <input type="text" name="course" placeholder="Enter course">

      <label>Semester:</label>
      <select name="semester">
      <option>Select Semester</option>
      <option>1st</option>
      <option>2nd</option>
      <option>3rd</option>
      <option>4th</option>
      <option>5th</option>
      <option>6th</option>
      <option>7th</option>
      <option>8th</option>
</select>
            </div>

        </div>

    </div>

</div>


      <!-- Address information -->
      <div id="address" class="common">
        <h3>Address Information:</h3>

        <label id="state-label">State:</label>
        <select id="state" name="state" required>
          <option value="">Select state</option>
          <option value="Andhra Pradesh">Andhra Pradesh</option>
          <option value="Arunachal Pradesh">Arunachal Pradesh</option>
          <option value="Assam">Assam</option>
          <option value="Bihar">Bihar</option>
          <option value="Chhattisgarh">Chhattisgarh</option>
          <option value="Goa">Goa</option>
          <option value="Gujarat">Gujarat</option>
          <option value="Haryana">Haryana</option>
          <option value="Himachal Pradesh">Himachal Pradesh</option>
          <option value="Jharkhand">Jharkhand</option>
          <option value="Karnataka">Karnataka</option>
          <option value="Kerala">Kerala</option>
          <option value="Madhya Pradesh">Madhya Pradesh</option>
          <option value="Maharashtra">Maharashtra</option>
          <option value="Manipur">Manipur</option>
          <option value="Meghalaya">Meghalaya</option>
          <option value="Mizoram">Mizoram</option>
          <option value="Nagaland">Nagaland</option>
          <option value="Odisha">Odisha</option>
          <option value="Punjab">Punjab</option>
          <option value="Rajasthan">Rajasthan</option>
          <option value="Sikkim">Sikkim</option>
          <option value="Tamil Nadu">Tamil Nadu</option>
          <option value="Telangana">Telangana</option>
          <option value="Tripura">Tripura</option>
          <option value="Uttar Pradesh">Uttar Pradesh</option>
          <option value="Uttarakhand">Uttarakhand</option>
          <option value="West Bengal">West Bengal</option>
        </select>

        <label>City:</label>
        <input type="text" name="city" placeholder="City" required>

        <label>Address:</label>
        <input type="text" name="address" placeholder="Address" required>

        <label>Street Name:</label>
        <input type="text" name="street_name" placeholder="Street Name" required>

        <label>Pin Code:</label>
        <input type="text" name="pin_code" placeholder="Pin Code" required>
        <br><br>


      </div>

      <div class="acknowledgement">
     <input type="checkbox" id="acknowledge" name="acknowledge" required>
     <label for="acknowledge">
        I hereby declare that the above information provided by me is true and correct
        to the best of my knowledge.
     </label>
     </div>      

      <div id="registerBtn"><button type="submit">Register</button></div>

    </form>

  </div>

</body>

</html>
